<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Império Urbano — cores do uniforme</title>
<style>body{margin:0;padding:24px;background:#101629;color:#f3efff;font:16px system-ui}main{max-width:1200px;margin:auto}h1{font-size:24px;margin:0 0 8px}p{color:#c0c8df;margin:8px 0 20px;line-height:1.5}#gallery{position:relative;width:100%;height:900px}canvas{display:block;width:100%;height:100%}.labels{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);pointer-events:none}.label{padding:14px;font-weight:700;text-align:center}.label span{display:inline-block;padding:7px 18px;border:1px solid;border-radius:18px;background:#11182a}small{color:#b7bfd8}@media(max-width:600px){body{padding:12px}h1{font-size:20px}#gallery{height:1100px}.labels{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,1fr)}.label{padding:8px;font-size:13px}}</style>
<main><h1>Luana · uniforme na cor do jogador</h1><p>Somente casaco e mangas mudam. Capacete, rosto, cabelo, botas, luvas e acessórios mantêm suas cores.</p><p><button id="front">Frente</button> <button id="back">Costas</button></p><div id="gallery"><div class="labels" id="labels"></div></div><p id="status">Carregando comparação…</p><small>Prévia isolada da arte; a integração com a seleção do jogador será feita pelo Claude.</small></main>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
const colors=[['Verde','#2e9e5b'],['Amarelo','#f2c230'],['Azul','#3d7dd8'],['Vermelho','#e63946'],['Roxo','#9b5de5'],['Laranja','#f28c28']];
const descriptor=await fetch('/models/characters/steampunk-brasil-v01-uniform-v04.json').then(r=>r.json());
const gltf=await new GLTFLoader().loadAsync(descriptor.glb);
const mask=await new THREE.TextureLoader().loadAsync(descriptor.uniform.mask);
mask.colorSpace=THREE.NoColorSpace;mask.flipY=false;mask.wrapS=mask.wrapT=THREE.ClampToEdgeWrapping;mask.generateMipmaps=false;mask.minFilter=mask.magFilter=THREE.LinearFilter;
const gallery=document.querySelector('#gallery');
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);gallery.prepend(renderer.domElement);
const scenes=[],materials=[],sourceColors=[];
gltf.scene.traverse(o=>{if(o.isMesh)sourceColors.push(o.material.color.getHexString());});
for(const [name,hex] of colors){
 const label=document.createElement('div');label.className='label';label.innerHTML=`<span style="border-color:${hex}">${name}</span>`;document.querySelector('#labels').append(label);
 const scene=new THREE.Scene();scene.background=new THREE.Color('#172139');
 scene.add(new THREE.HemisphereLight(0xdce8ff,0x3d3555,1.1));const light=new THREE.DirectionalLight(0xffffff,1.6);light.position.set(2,3,2);scene.add(light);
 const model=gltf.scene.clone(true);
 model.traverse(o=>{if(!o.isMesh)return;const material=o.material.clone();const color=new THREE.Color(hex),strength={value:1};materials.push({material,color,strength});material.onBeforeCompile=shader=>{
  shader.uniforms.uniformMask={value:mask};shader.uniforms.uniformPlayerColor={value:color};shader.uniforms.uniformReference={value:descriptor.uniform.referenceLuminance};shader.uniforms.uniformLocalYRange={value:new THREE.Vector2(...descriptor.uniform.localYRange)};
  shader.uniforms.uniformStrength=strength;
  shader.vertexShader='varying float uniformLocalY;\n'+shader.vertexShader;
  shader.vertexShader=shader.vertexShader.replace('#include <begin_vertex>','#include <begin_vertex>\nuniformLocalY=position.y;');
  shader.fragmentShader='uniform sampler2D uniformMask; uniform vec3 uniformPlayerColor; uniform float uniformReference; uniform vec2 uniformLocalYRange; uniform float uniformStrength; varying float uniformLocalY;\n'+shader.fragmentShader;
  shader.fragmentShader=shader.fragmentShader.replace('#include <map_fragment>',`#include <map_fragment>
  float uniformWeight=texture2D(uniformMask,vMapUv).r*step(uniformLocalYRange.x,uniformLocalY)*step(uniformLocalY,uniformLocalYRange.y)*uniformStrength;
  float uniformShade=clamp(dot(diffuseColor.rgb,vec3(0.2126,0.7152,0.0722))/uniformReference,0.15,2.0);
  diffuseColor.rgb=mix(diffuseColor.rgb,uniformPlayerColor*uniformShade,uniformWeight);`);
 };material.customProgramCacheKey=()=> 'luana-masked-luminance-v1';o.material=material;});
 const box=new THREE.Box3().setFromObject(model),height=box.max.y-box.min.y,center=box.getCenter(new THREE.Vector3());const normalized=new THREE.Group();normalized.add(model);normalized.scale.setScalar(1/height);normalized.position.set(-center.x/height,.06-box.min.y/height,-center.z/height);scene.add(normalized);
 const base=new THREE.Mesh(new THREE.CylinderGeometry(.25,.27,.06,48),new THREE.MeshStandardMaterial({color:hex}));base.position.y=.03;scene.add(base);
 const camera=new THREE.PerspectiveCamera(30,1,.01,100);camera.position.set(.35,.70,2.45);camera.lookAt(0,.54,0);scenes.push({scene,camera});
}
function render(){const width=gallery.clientWidth,height=gallery.clientHeight,columns=width<600?2:3,rows=6/columns;renderer.setSize(width,height,false);renderer.setScissorTest(true);scenes.forEach(({scene,camera},i)=>{const x=Math.round((i%columns)*width/columns),y=Math.round((rows-1-Math.floor(i/columns))*height/rows),w=Math.round(width/columns),h=Math.round(height/rows);renderer.setViewport(x,y,w,h);renderer.setScissor(x,y,w,h);camera.aspect=w/h;camera.updateProjectionMatrix();renderer.render(scene,camera);});renderer.setScissorTest(false);}
addEventListener('resize',render);render();
document.querySelector('#back').onclick=()=>{scenes.forEach(({camera})=>{camera.position.set(-.35,.70,-2.45);camera.lookAt(0,.54,0);});render();};
document.querySelector('#front').onclick=()=>{scenes.forEach(({camera})=>{camera.position.set(.35,.70,2.45);camera.lookAt(0,.54,0);});render();};
function regionPixels(index,rect){const width=gallery.clientWidth,height=gallery.clientHeight,columns=width<600?2:3,rows=6/columns,w=Math.round(width/columns),h=Math.round(height/rows),x=Math.round((index%columns)*width/columns),y=Math.round((rows-1-Math.floor(index/columns))*height/rows);const rw=Math.round(rect[2]*w),rh=Math.round(rect[3]*h),bytes=new Uint8Array(rw*rh*4),gl=renderer.getContext();gl.readPixels(x+Math.round(rect[0]*w),y+h-Math.round((rect[1]+rect[3])*h),rw,rh,gl.RGBA,gl.UNSIGNED_BYTE,bytes);return bytes;}
function maxDelta(a,b){let max=0,changed=0,first=-1,last=-1;for(let i=0;i<a.length;i+=4){const delta=Math.max(Math.abs(a[i]-b[i]),Math.abs(a[i+1]-b[i+1]),Math.abs(a[i+2]-b[i+2]));max=Math.max(max,delta);if(delta>5){changed++;if(first<0)first=i/4;last=i/4;}}return {max,changed,first,last};}
const tinted=colors.map((_,i)=>({head:regionPixels(i,[.25,.10,.50,.34]),face:regionPixels(i,[.40,.24,.20,.15]),boots:regionPixels(i,[.35,.74,.30,.06]),coat:regionPixels(i,[.30,.49,.40,.23])}));
materials.forEach(m=>m.strength.value=0);render();
// Comparar ligado/desligado no MESMO viewport evita diferenças de derivadas da GPU entre colunas.
const pixelChecks=colors.map(([name],i)=>({color:name,head:maxDelta(tinted[i].head,regionPixels(i,[.25,.10,.50,.34])),face:maxDelta(tinted[i].face,regionPixels(i,[.40,.24,.20,.15])),boots:maxDelta(tinted[i].boots,regionPixels(i,[.35,.74,.30,.06])),coat:maxDelta(tinted[i].coat,regionPixels(i,[.30,.49,.40,.23]))}));
materials.forEach(m=>m.strength.value=1);render();
const samples={};const ctx=document.createElement('canvas').getContext('2d');ctx.canvas.width=mask.image.width;ctx.canvas.height=mask.image.height;ctx.drawImage(mask.image,0,0);const data=ctx.getImageData(0,0,ctx.canvas.width,ctx.canvas.height).data;let nonzero=0;for(let i=0;i<data.length;i+=4)if(data[i]>127)nonzero++;
window.uniformQA={ready:true,pixelChecks,colors:colors.map(([name,hex])=>({name,hex})),maskSize:[mask.image.width,mask.image.height],maskColorSpace:mask.colorSpace,maskFlipY:mask.flipY,uniqueMaterials:new Set(materials.map(m=>m.material.uuid)).size,sharedMask:true,sourceMaterialUnchanged:sourceColors.every((color,i)=>{let n=0,result=true;gltf.scene.traverse(o=>{if(o.isMesh){if(n===i)result=o.material.color.getHexString()===color;n++;}});return result;}),maskedTexelsAboveHalf:nonzero,referenceLuminance:descriptor.uniform.referenceLuminance};
document.querySelector('#status').textContent='Seis cores, um modelo e uma máscara compartilhada. Cor e material independentes por personagem.';
</script></html>
