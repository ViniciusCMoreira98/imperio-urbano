<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configurações — kit de arte</title><link rel="stylesheet" href="/apps/web/src/settings-art/settings-controls.css"><style>html,body{margin:0;height:100%;background:#00162b}.scene{position:fixed;inset:0;width:100%;height:100%;border:0;pointer-events:none}#reopen{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:1rem;border:2px solid gold;border-radius:12px;background:#062f5f;color:white;font:18px Arial}#reopen[hidden]{display:none}#toast{position:fixed;bottom:6px;left:50%;transform:translateX(-50%);padding:6px 14px;border-radius:10px;background:#001326;color:white;font:13px Arial;z-index:100}#toast:empty{display:none}</style></head><body>
<iframe class="scene" src="/scripts/assets/main-menu-preview/" tabindex="-1" aria-hidden="true" inert title="Cenário decorativo"></iframe><button id="reopen" hidden>Reabrir configurações</button>
<dialog class="st-dialog" id="settings" aria-labelledby="settings-title"><section class="st-panel">
<img class="st-skyline" src="/apps/web/src/settings-art/art/skyline-v1.svg" alt=""><div class="st-heading"><img src="/apps/web/src/main-menu/art/gear-v1.svg" alt=""><h1 id="settings-title">CONFIGURAÇÕES</h1></div><button class="st-close" aria-label="Fechar configurações"></button>
<nav class="st-tabs" role="tablist" aria-label="Categorias das configurações"><button class="st-tab" id="tab-general" role="tab" aria-selected="true" aria-controls="settings-content" data-tab="general"><img src="/apps/web/src/main-menu/art/gear-v1.svg" alt="">Geral</button><button class="st-tab" id="tab-sound" role="tab" aria-selected="false" aria-controls="settings-content" data-tab="sound" tabindex="-1"><img src="/apps/web/src/settings-art/art/music-v1.svg" alt="">Som</button><button class="st-tab" id="tab-account" role="tab" aria-selected="false" aria-controls="settings-content" data-tab="account" tabindex="-1"><img src="/apps/web/src/settings-art/art/profile-v1.svg" alt="">Conta</button></nav>
<div class="st-body" id="settings-content" role="tabpanel" aria-labelledby="tab-general"></div><footer class="st-footer" id="settings-footer"></footer>
</section></dialog><dialog class="st-confirm" id="confirm" aria-labelledby="confirm-title"><h2 id="confirm-title">Excluir conta?</h2><p>Esta é uma prévia visual. Nenhuma conta será alterada.</p><button id="cancel-delete">Cancelar</button></dialog><div id="toast" role="status"></div><script type="module" src="./preview.mjs"></script></body></html>
