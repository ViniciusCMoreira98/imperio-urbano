<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Império Urbano — prévia do menu</title><link rel="stylesheet" href="/apps/web/src/main-menu/menu-assets.css"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#00162b}body{display:grid;place-items:center}.mi-scene{width:min(100vw,177.7778vh)}#notice{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:#001c34;color:#fff;padding:12px 20px;border:2px solid #ffd64c;border-radius:12px;font:14px Arial;z-index:10}#notice:empty{display:none}</style></head><body>
<main class="mi-scene" aria-label="Prévia visual do menu inicial">
<div class="mi-profile"><div class="mi-avatar"><img src="/apps/web/src/hud/art/avatars-c8/avatar-2.webp" alt="Retrato do jogador"></div><strong class="mi-name">Vinícius</strong><div class="mi-level"><img src="/apps/web/src/main-menu/art/crown-v1.svg" alt="">Nível 28</div><div class="mi-progress"><span>12.450 / 15.000</span></div></div>
<div class="mi-wallets"><div class="mi-wallet"><img class="mi-currency" src="/apps/web/src/main-menu/art/coin-v1.svg" alt="Moedas"><span>156.800</span><button class="mi-add" aria-label="Adicionar moedas"><img src="/apps/web/src/main-menu/art/plus-v1.svg" alt=""></button></div><div class="mi-wallet"><img class="mi-currency" src="/apps/web/src/main-menu/art/diamond-v1.svg" alt="Diamantes"><span>2.430</span><button class="mi-add" aria-label="Adicionar diamantes"><img src="/apps/web/src/main-menu/art/plus-v1.svg" alt=""></button></div></div>
<button class="mi-settings" aria-label="Configurações"><img src="/apps/web/src/main-menu/art/gear-v1.svg" alt=""></button>
<img class="mi-logo" src="/apps/web/src/main-menu/art/logo-v1.webp" alt="Império Urbano — Edição Brasil">
<img class="mi-mascot" src="/apps/web/src/main-menu/art/mascot-v1.webp" alt="" aria-hidden="true">
<div class="mi-actions"><button class="mi-play"><img src="/apps/web/src/main-menu/art/dice-v1.webp" alt=""><strong>Jogar Agora</strong><small>Mesma rede local</small></button><button class="mi-play mi-online"><img src="/apps/web/src/main-menu/art/players-v1.svg" alt=""><strong>Jogar Online</strong><small>Salas Multiplayer</small></button></div>
<button class="mi-help"><img class="mi-laurel" src="/apps/web/src/main-menu/art/laurel-left-v1.svg" alt=""><img class="mi-book" src="/apps/web/src/main-menu/art/book-v1.svg" alt=""><strong>Como Jogar</strong><img class="mi-laurel" src="/apps/web/src/main-menu/art/laurel-right-v1.svg" alt=""></button>
</main><div id="notice" role="status"></div><script>document.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>{if(button.matches('.mi-play')){location.href='/scripts/assets/play-menu-preview/?view='+(button.classList.contains('mi-online')?'online':'lan');return;}const notice=document.querySelector('#notice');notice.textContent='Prévia visual — '+(button.getAttribute('aria-label')||button.innerText.replace(/\s+/g,' '));clearTimeout(window.noticeTimer);window.noticeTimer=setTimeout(()=>notice.textContent='',2000)}));</script></body></html>
