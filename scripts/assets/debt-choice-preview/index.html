<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Império Urbano — arte de pagar a dívida</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#50352d;background:#153d37}button{font:inherit}main{height:100dvh;position:relative;background:center/100% 100% no-repeat;isolation:isolate}.dialog{position:absolute;left:52%;top:54%;transform:translate(-50%,-50%);width:310px;padding:13px;border:1px solid transparent;border-radius:6px;overflow:hidden;isolation:isolate;box-shadow:0 2px 3px #071d3330}.dialog:before{content:'';position:absolute;inset:-1px;z-index:-1;border:1px solid transparent;border-image-source:url('/assets/debt/payment-v1/frame.webp');border-image-slice:174 fill;border-image-width:18px;pointer-events:none}.intro{display:flex;justify-content:center;align-items:center;gap:9px;min-height:34px}.emblem{width:34px;height:34px;object-fit:contain}h1{font-size:21px;line-height:1.05;margin:0;color:#6d2331;letter-spacing:-.5px}.numbers{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin:10px 0 0}.numbers b{margin-left:4px;color:#702737}.numbers span:last-child b{color:#4d5341}.instruction{text-align:center;margin:10px 0;color:#5a4c3f;font-size:13px;line-height:1.3}.instruction small{display:block;margin-top:2px;font-size:11px;color:#85735a}.selection{display:none;margin:10px 0;border:1px solid #b99b65;border-radius:5px;padding:5px 7px;background:#fff4d5}.selection .line{display:flex;justify-content:space-between;gap:5px;font-size:12px}.selection strong{color:#11634c}.selection small{display:block;font-size:10px;color:#715d43;margin-top:3px}.status{font-size:12px;text-align:center;font-weight:700;margin:6px 0 9px;color:#8c363e}.has-selection .status{color:#1b654b}.has-selection .instruction{display:none}.has-selection .selection{display:block}.actions{display:grid;grid-template-columns:1fr auto;gap:7px}.confirm{font-size:12px;font-weight:800;padding:8px;border:1px solid #97702c;border-radius:8px;color:#4a310e;background:linear-gradient(#ffdc77,#d8a332);box-shadow:inset 0 1px #fff2bd,0 2px #8c6422;min-height:32px}.confirm:disabled{background:#e2d9c4;color:#91856f;border-color:#c0b49a;box-shadow:inset 0 1px #fff}.skip{font-size:11px;min-height:32px;padding:7px;border:1px solid #ad7b75;border-radius:8px;background:#fff1e3;color:#8b3942;font-weight:700}.hopeless .instruction,.hopeless .selection,.hopeless .confirm{display:none}.hopeless .status{color:#8c363e}.hopeless .actions{grid-template-columns:1fr}.art-only{background:radial-gradient(ellipse at center,#376b56,#163e37 70%)}.art-only .dialog{width:500px;padding:22px;left:50%;top:50%;transform:translate(-50%,-50%) scale(1.25)}.art-only .dialog:before{border-image-width:30px}.art-only .intro{min-height:76px;gap:18px}.art-only .emblem{width:76px;height:76px}.art-only h1{font-size:30px}.art-only .numbers{font-size:16px;margin-top:16px}.art-only .instruction{font-size:17px;margin:18px 0}.art-only .instruction small{font-size:13px;margin-top:5px}.art-only .status{font-size:16px;margin:12px 0 16px}.art-only .confirm,.art-only .skip{font-size:15px;padding:12px}
@media(max-height:500px){.dialog{width:208px;padding:8px}.intro{min-height:24px;gap:6px}.emblem{width:24px;height:24px}h1{font-size:14px}.numbers{font-size:10px;margin-top:5px;gap:4px}.numbers b{margin-left:2px}.instruction{font-size:11px;line-height:1.1;margin:5px 0}.instruction small{font-size:9px;margin-top:1px}.selection{margin:5px 0;padding:3px 4px}.selection .line{font-size:10px}.selection small{font-size:9px;margin-top:1px}.status{font-size:10px;margin:4px 0 5px}.actions{gap:5px}.confirm,.skip{font-size:10px;min-height:27px;padding:5px 4px}}
@media(max-width:700px) and (max-height:500px){.dialog{width:160px;left:51%;top:51%;padding:6px}.dialog:before{border-image-width:15px}.intro{min-height:18px;gap:5px}.emblem{width:18px;height:18px}h1{font-size:12px;letter-spacing:-.3px}.numbers{font-size:9px;margin-top:4px}.instruction{font-size:10.5px;margin:4px 0}.instruction small{font-size:8px}.selection .line{font-size:10px}.selection small{font-size:8px}.status{font-size:9px;margin:4px 0}.actions{gap:4px}.confirm,.skip{font-size:9px;min-height:26px;padding:5px 2px}}
</style>
<main><section class="dialog" role="dialog" aria-labelledby="title" aria-describedby="instruction">
 <header class="intro"><img class="emblem" src="/assets/debt/payment-v1/emblem.webp" alt=""><h1 id="title">Pagar a dívida</h1></header>
 <p class="numbers"><span title="Dívida com o banco">Deve <b>R$ 250</b></span><span>Saldo <b>R$ 100</b></span></p>
 <p class="instruction" id="instruction"><b>Toque nos seus estados.</b><small>Venda ao banco: 80% do valor.</small></p>
 <div class="selection"><div class="line"><b class="state">São Paulo</b><strong class="value">+R$ 192</strong></div><small>Terreno · valor total da venda</small></div>
 <p class="status" role="status">Faltam R$ 150</p>
 <div class="actions"><button class="confirm" disabled>Vender estados</button><button class="skip">Falência</button></div>
</section></main>
<script type="module">
const params=new URLSearchParams(location.search),main=document.querySelector('main');
const background=innerHeight>500?'1280x720':innerWidth>=750?'800x360':'667x280';
if(params.has('art'))main.classList.add('art-only');else main.style.backgroundImage=`url('/assets/3d/reviews/v1-adverse/hotels-high-values-${background}.png')`;
if(params.has('selected')){main.classList.add('has-selection');document.querySelector('.confirm').disabled=false;document.querySelector('.confirm').textContent='Vender 1 estado';document.querySelector('.status').textContent='Após pagar, sobram R$ 42';}
if(params.has('partial')){document.querySelector('.confirm').disabled=true;document.querySelector('.state').textContent='Amazonas';document.querySelector('.value').textContent='+R$ 48';document.querySelector('.status').textContent='Ainda faltam R$ 102';}
if(params.has('hopeless')){main.classList.add('hopeless');document.querySelector('.status').textContent='Mesmo vendendo tudo, não dá para pagar.';}
</script>
</html>
