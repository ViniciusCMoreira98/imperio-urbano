<!doctype html>
<html lang="pt-BR">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Império Urbano — arte da escolha do destino</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#092d38;color:#173c39}button{font:inherit}main{height:100dvh;width:100%;display:grid;place-items:center;background:center/100% 100% no-repeat;position:relative;isolation:isolate}.dialog{width:420px;position:relative;padding:17px 20px 16px;border:2px solid #ffdb7c;border-radius:22px;background:linear-gradient(130deg,#fffdf1,#f9efd5);box-shadow:0 2px 0 #8c591b,0 0 0 3px #176353,0 0 0 5px #e5b852,0 10px 22px #071d3380;text-align:left}.intro{display:grid;grid-template-columns:79px 1fr;align-items:center;gap:13px}.emblem{width:79px;height:86px;object-fit:contain;filter:drop-shadow(0 3px 2px #8a6b3333)}.eyebrow{font-size:10px;letter-spacing:1.5px;font-weight:800;color:#2c7c62;margin:0 0 5px}h1{font-size:25px;line-height:1.02;margin:0;color:#074c44;letter-spacing:-.6px}.instruction{margin:13px 0 11px;display:flex;gap:10px;align-items:center;background:#e1ede0;border:1px solid #b4d2ba;border-radius:11px;padding:10px 11px;font-size:14px;line-height:1.35}.touch{width:25px;height:28px;flex-shrink:0;color:#096d54}.selection{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 1px;margin:10px 0 12px;font-size:12px;color:#53635a}.selection strong{font-size:14px;color:#0d5a44}.selection .value{border-radius:7px;border:1px dashed #b2bcac;padding:6px 10px;min-width:100px;text-align:center}.selection.chosen .value{background:#e4efd9;border-style:solid;border-color:#87ad66}.actions{display:grid;grid-template-columns:1fr auto;gap:9px;align-items:center}.confirm{background:linear-gradient(#ffc94c,#ed9b16);color:#45300b;border:1px solid #b67916;box-shadow:inset 0 1px #fff2ba,0 2px #b7781c;border-radius:10px;font-size:14px;font-weight:800;padding:10px 15px;min-height:38px}.confirm:disabled{background:#e4dfd0;border-color:#c4c0b2;box-shadow:inset 0 1px #fff;color:#7b7a70}.skip{background:#fffdf4;border:1px solid #aaa68d;border-radius:10px;padding:10px 12px;min-height:38px;color:#446155;font-size:12px;font-weight:700}.cost{margin:10px 0 0;text-align:center;color:#6f6a55;font-size:11px}.cost b{color:#315846}.event .actions{grid-template-columns:1fr}.art-only{background:radial-gradient(ellipse at center,#2e7669,#103e40 70%)}.art-only .dialog{width:510px;transform:scale(1.3)}
@media(max-height:500px){.dialog{width:clamp(280px,46vw,380px);padding:10px 13px 11px;border-radius:17px}.intro{grid-template-columns:53px 1fr;gap:9px}.emblem{width:53px;height:59px}.eyebrow{font-size:8px;letter-spacing:1.1px;margin-bottom:4px}h1{font-size:20px}.instruction{margin:8px 0;font-size:12px;padding:7px 8px;gap:7px;border-radius:8px}.touch{width:22px;height:24px}.selection{font-size:10px;margin:8px 0}.selection strong{font-size:12px}.selection .value{padding:4px 6px;min-width:86px}.actions{gap:7px}.confirm{min-height:32px;padding:7px 8px;font-size:12px}.skip{min-height:32px;padding:7px 8px;font-size:10px}.cost{font-size:9px;margin-top:7px}}
</style>
<style>
/* O cartão cabe no miolo no celular; a pista de estados permanece ao redor. */
@media(max-height:500px){
 .dialog{width:clamp(236px,35vw,290px);padding:9px 11px 10px;border-radius:15px}
 .intro{grid-template-columns:40px 1fr;gap:8px}.emblem{width:40px;height:40px}.eyebrow{display:none}h1{font-size:17px;line-height:1.04}
 .instruction{font-size:12px;line-height:1.25;border:0;background:none;padding:0;margin:8px 0 9px;gap:7px;border-radius:0}.touch{width:19px;height:24px}
 .selection{display:none}.selection.chosen{display:flex;margin:0 0 8px}.selection .value{min-width:0;padding:3px 5px}.selection strong{font-size:11px}
 .confirm{font-size:11px;min-height:30px;padding:6px}.skip{font-size:10px;min-height:30px;padding:6px}.actions{gap:6px}.cost{font-size:9px;margin-top:6px}
}
</style>
<style>
.center-layout .dialog{position:absolute;left:52%;top:54%;transform:translate(-50%,-50%);width:320px;padding:12px;border-radius:15px;box-shadow:0 0 0 2px #176353,0 0 0 4px #e5b852,0 2px 3px #071d3330}
.center-layout .intro{grid-template-columns:42px 1fr;gap:10px}.center-layout .emblem{width:42px;height:42px}.center-layout .eyebrow{display:none}.center-layout h1{font-size:20px;line-height:1.05;letter-spacing:-.4px}.center-layout .instruction{display:block;margin:9px 0 10px;padding:0;border:0;background:none;font-size:13px;line-height:1.25;text-align:center}.center-layout .touch{display:none}.center-layout .selection{display:none}.center-layout .selection.chosen{display:flex;margin:9px 0 10px;font-size:11px}.center-layout .selection .value{min-width:0;padding:4px 6px}.center-layout .selection strong{font-size:12px}.center-layout.has-selection .instruction{display:none}.center-layout .confirm{min-height:32px;padding:7px;font-size:12px}.center-layout .skip{min-height:32px;padding:7px;font-size:11px}.center-layout .cost{font-size:10px;margin-top:7px}
@media(max-height:500px){
 .center-layout .dialog{width:clamp(184px,27vw,224px);padding:8px;border-width:1px;border-radius:12px;box-shadow:0 0 0 1px #176353,0 0 0 2px #e5b852}
 .center-layout .intro{grid-template-columns:26px 1fr;gap:7px}.center-layout .emblem{width:26px;height:26px}.center-layout h1{font-size:14px;letter-spacing:-.3px}
 .center-layout .instruction{font-size:11px;line-height:1.15;margin:7px 0 8px;white-space:nowrap}.center-layout .selection.chosen{margin:6px 0 7px;gap:4px;font-size:9px}.center-layout .selection.chosen>span:first-child{font-size:0}.center-layout .selection.chosen>span:first-child:after{content:'Destino';font-size:10px}.center-layout .selection .value{padding:3px 5px}.center-layout .selection strong{font-size:11px}
 .center-layout .confirm,.center-layout .skip{min-height:28px;padding:5px 4px;font-size:10px}.center-layout .cost{font-size:9px;margin-top:6px}
}
</style>
<style>
@media(max-width:700px) and (max-height:500px){
 .center-layout .dialog{width:160px;left:51%;top:51%;padding:6px}
 .center-layout .intro{grid-template-columns:20px 1fr;gap:6px}.center-layout .emblem{width:20px;height:20px}.center-layout h1{font-size:12.5px}
 .center-layout .instruction{white-space:normal;font-size:11px;line-height:1.1;margin:5px 0}
 .center-layout .selection.chosen{margin:5px 0;gap:2px}.center-layout .selection .value{padding:2px 3px}.center-layout .selection strong{font-size:10px}
 .center-layout .confirm,.center-layout .skip{min-height:26px;padding:4px 2px;font-size:10px}.center-layout .actions{gap:4px}.center-layout .cost{font-size:8.5px;line-height:1.1;margin-top:4px}
}
</style>
<link rel="stylesheet" href="./theme.css"><main>
 <section class="dialog" role="dialog" aria-labelledby="title" aria-describedby="instruction">
  <header class="intro"><img class="emblem" src="/assets/airport/destination-v1/emblem.webp" alt=""><div><p class="eyebrow">AEROPORTO</p><h1 id="title">Escolha seu<br>destino</h1></div></header>
  <p class="instruction" id="instruction"><svg class="touch" viewBox="0 0 28 32" fill="none" aria-hidden="true"><path d="M11 18V5a2 2 0 0 1 4 0v10-3a2 2 0 0 1 4 0v3-1a2 2 0 0 1 4 0v2a2 2 0 0 1 4 0v7c0 5-4 8-9 8-3 0-5-1-7-4l-6-8a2 2 0 0 1 3-3l3 2Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 5H2M7 1 5-1M4 10l-2 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span><b>Toque no estado de destino</b> no tabuleiro.</span></p>
  <div class="selection"><span>Destino selecionado</span><span class="value">Nenhum ainda</span></div>
  <div class="actions"><button class="confirm" disabled>Viajar</button><button class="skip">Rolar dados</button></div>
  <p class="cost">Valor da viagem: <b>R$ 50</b></p>
 </section>
</main>
<script type="module">
const params=new URLSearchParams(location.search),main=document.querySelector('main'),dialog=document.querySelector('.dialog');
const width=innerWidth,background=innerHeight>500?'1280x720':width>=750?'800x360':'667x280';
if(params.has('art'))main.classList.add('art-only');else main.style.backgroundImage=`url('/assets/3d/reviews/v1-adverse/hotels-high-values-${background}.png')`;
if(params.has('selected')){document.querySelector('.selection').classList.add('chosen');document.querySelector('.value').innerHTML='<strong>São Paulo · SP</strong>';document.querySelector('.confirm').disabled=false;}
if(!params.has('art')){
 main.classList.add('center-layout');document.querySelector('h1').textContent=params.has('selected')?'Confirme a viagem':'Escolha o destino';
 document.querySelector('.instruction span').innerHTML='<b>Toque no estado de destino.</b>';
 if(params.has('selected'))main.classList.add('has-selection');
}
</script>
</html>
