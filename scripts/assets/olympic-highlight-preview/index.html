<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estado-sede — nova arte</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#083d46;color:#fff9de}main{min-height:100dvh;padding:45px 30px 35px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 65% 35%,#21736d,#103c47 65%,#092e39)}h1{font-size:27px;margin:0 0 10px;letter-spacing:-.5px}.caption{font-size:13px;color:#b9d1c6;margin:0 0 25px}.comparison{display:flex;gap:75px;align-items:flex-end}.example{width:300px;text-align:center}.card-space{height:410px;display:flex;align-items:flex-end;justify-content:center}.label{font-size:13px;letter-spacing:1.2px;text-transform:uppercase;font-weight:bold;color:#c0d2c5;margin:20px 0 0}.host-label{color:#ffe08b}.normal{position:relative;width:270px;height:290px;border-radius:14px;background:#fff7df;border:3px solid #d9af51;box-shadow:0 8px 18px #001d2b66;overflow:hidden}.normal .state-name{left:9px;right:9px;top:10px}.state-name{position:absolute;background:linear-gradient(110deg,#874bcc,#ad70e0);color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;height:32px;border-radius:6px;text-shadow:0 1px #3c1f7a;white-space:nowrap}.uf{font-size:22px;font-weight:900}.name{font-size:17px;font-weight:bold}.photo{position:absolute;object-fit:contain;background:#fff7df}.normal .photo{left:9px;top:52px;width:246px;height:164px}.rent{position:absolute;display:flex;align-items:center;justify-content:center;gap:6px;color:#18334a;background:#fffae8;border:1px solid #e4cea1;border-radius:5px;font-size:23px;font-weight:900;white-space:nowrap}.normal .rent{left:9px;right:9px;top:232px;height:37px}.host{position:relative;width:300px;height:400px;filter:drop-shadow(0 7px 12px #00233888)}.host .state-name{left:36px;right:36px;top:122px;height:29px}.host .uf{font-size:21px}.host .name{font-size:16px}.host .photo{left:35px;top:160px;width:230px;height:154px}.host .rent{left:48px;right:48px;top:334px;height:34px;font-size:21px}.multiplier{color:#8a6510;font-size:12px;background:#f4df90;border-radius:4px;padding:3px 4px}.frame{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}.host-surface{position:absolute;left:27px;right:27px;top:114px;bottom:23px;border-radius:8px;background:#fff8e3}.host-title{position:absolute;z-index:1;left:83px;right:83px;top:94px;height:12px;display:flex;justify-content:center;align-items:center;color:#fff1b3;font-size:10px;font-weight:900;letter-spacing:.5px;white-space:nowrap;text-shadow:0 1px 2px #001349}.badge-demo{position:relative;width:220px;aspect-ratio:2;margin:20px auto 0}.badge-demo img{width:100%;height:100%;object-fit:contain}.badge-demo span{position:absolute;left:17%;right:17%;top:74%;color:#fff1ac;font-size:12px;font-weight:900;text-align:center;letter-spacing:.5px}.note{font-size:11px;color:#a8c6ba;margin:24px 0 0;text-align:center}.single .ordinary{display:none}.single .comparison{gap:0}.single .caption{max-width:330px;text-align:center}.single .badge-demo{display:none}
@media(max-height:500px){main{min-height:100dvh;padding:15px}.comparison{gap:36px;zoom:.62}h1{font-size:18px}.caption{font-size:11px;margin-bottom:4px}.note{font-size:9px;margin-top:10px}.badge-demo{display:none}}
</style>
<main><h1>Um destaque próprio para o estado-sede</h1><p class="caption">Aros maiores, azul marcante e identificação explícita de sede.</p>
 <div class="comparison">
  <article class="example ordinary"><div class="card-space"><div class="normal"><header class="state-name"><b class="uf">SP</b><span class="name">São Paulo</span></header><img class="photo" src="/apps/web/src/board/board34/art/v3/sp-board-v3.png" alt="Ilustração atual de São Paulo"><div class="rent"><span class="base-rent"></span></div></div></div><p class="label">Propriedade comum</p></article>
  <article class="example"><div class="card-space"><div class="host"><div class="host-surface"></div><header class="state-name"><b class="uf">SP</b><span class="name">São Paulo</span></header><img class="photo" src="/apps/web/src/board/board34/art/v3/sp-board-v3.png" alt="Mesma ilustração de São Paulo"><div class="rent"><span class="host-rent"></span><b class="multiplier">×2</b></div><img class="frame" src="/assets/olympic-host/highlight-v3/frame.webp" alt=""><strong class="host-title">SEDE OLÍMPICA</strong></div></div><p class="label host-label">Sede das Olimpíadas</p></article>
 </div>
 <div class="badge-demo"><img src="/assets/olympic-host/highlight-v3/badge.webp" alt="Marcador complementar com os aros olímpicos"><span>SEDE OLÍMPICA</span></div>
 <p class="note">Estudo frontal de acabamento • foto preservada • dados e textos separados da arte</p>
</main>
<script type="module">
const {states}=await fetch('/packages/game-data/data/states.json').then(r=>r.json()),state=states.find(s=>s.id==='SP'),money=v=>'R$ '+v.toLocaleString('pt-BR');
document.querySelector('.base-rent').textContent=money(state.rent.base);document.querySelector('.host-rent').textContent=money(state.rent.base*2);
if(new URLSearchParams(location.search).has('single'))document.querySelector('main').classList.add('single');
</script></html>
