spring.application.name=imperio-urbano-api
# (porta definida na seção de produção abaixo)

# PostgreSQL local: infrastructure/docker/compose.yaml
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/imperio}
spring.datasource.username=${DB_USER:imperio}
spring.datasource.password=${DB_PASSWORD:imperio}

# Esquema controlado só pelo Flyway; o Hibernate apenas confere.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Origens do navegador aceitas no WebSocket (o Vite em desenvolvimento).
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}

# Ferramentas de desenvolvedor (escolher o próximo lance). Desligadas por padrão; nunca em produção.
app.dev-tools.enabled=${DEV_TOOLS:false}

# Login com Google: Client ID (público) de "Aplicativo da Web" no Google Cloud. Vazio = botão escondido.
app.google.client-id=${GOOGLE_CLIENT_ID:}

# --- Produção (site, API e WebSocket no mesmo servidor; docs/15-publicacao-navegador.md) ---
# Porta: as hospedagens costumam passar PORT; SERVER_PORT continua valendo.
server.port=${PORT:8080}
# Atrás do proxy com HTTPS da hospedagem: respeita X-Forwarded-Proto/Host.
server.forward-headers-strategy=framework
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,text/javascript,application/json,image/svg+xml,model/gltf+json
server.compression.min-response-size=1024
# Encerramento gracioso: termina as requisições em andamento antes de parar.
server.shutdown=graceful
# Saúde para a hospedagem; nada além disso fica exposto.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
